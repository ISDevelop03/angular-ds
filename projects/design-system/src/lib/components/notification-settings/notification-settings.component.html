<div
  id="ds-notification-settings"
  [ngClass]="[className, 'w-full bg-white rounded-lg p-4']"
>
  <div
    class="flex justify-between w-full items-center gap-3 mb-3 border-b border-gray-200 pb-3"
  >
    <div class="flex items-center gap-3 min-w-0">
      <ds-icon
        id="audio-settings-01"
        size="20"
        class="text-primary-500 shrink-0"
      ></ds-icon>
      <h2 class="text-[18px] font-bold truncate min-w-0">
        {{ title }}
      </h2>
    </div>
    <button class="shrink-0">
      <ds-icon id="close" size="24" class="text-gray-500"></ds-icon>
    </button>
  </div>
  <div class="text-sm text-gray-600 mb-4">
    <p>{{ description }}</p>
  </div>
  <div class="flex justify-between items-center mb-3">
    <p class="text-sm font-bold">
      {{ notificationsEnabled ? "Activées" : "Désactivées" }}
    </p>
    <ds-toggle
      id="toggle-notifications"
      [checked]="notificationsEnabled"
      (onChange)="onNotificationsChange($event)"
    ></ds-toggle>
  </div>
  <div class="flex flex-col gap-3 py-4 px-5 bg-crame-50 rounded-lg">
    <h3 class="text-sm font-bold">Vous êtes notifié pour :</h3>
    <ul class="list-disc list-inside marker:text-[#00BC7D]">
      <li *ngFor="let notification of notifications">{{ notification }}</li>
    </ul>
  </div>
</div>
