<div
  id="ds-unhabilitated-widget"
  [ngClass]="['relative w-full h-full rounded-lg overflow-hidden', className]"
>
  <img
    [src]="backgroundImage"
    alt="Unhabilitated Widget"
    class="z-10 absolute top-0 left-0 w-full h-full object-cover"
  />
  <div class="z-20 absolute top-0 left-0 w-full h-full bg-black/30"></div>
  <div
    class="z-30 absolute top-0 left-0 right-0 bottom-0 m-auto w-3/4 h-fit flex items-center justify-center bg-white rounded-lg p-6"
  >
    <div class="flex flex-col items-center justify-center">
      <img
        [src]="modalImage"
        alt="Unhabilitated Widget"
        class="w-[176px] h-full object-cover mb-6"
      />
      <h2 class="text-lg font-bold mb-1">{{ title }}</h2>
      <p class="text-sm text-gray-700">{{ description }}</p>
    </div>
  </div>
</div>
