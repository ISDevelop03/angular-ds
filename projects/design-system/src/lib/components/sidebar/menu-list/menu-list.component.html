<!-- ds-menu-list.component.html -->
<ul class="menu-wrapper w-full max-w-[280px] mt-4">
  <ng-container *ngFor="let item of data">
    <li class="relative">
      <ng-container *ngIf="hasChildren(item); else linkLevel1">
        <div
          tabindex="0"
          role="button"
          class="flex w-full justify-between items-center"
          (click)="toggle(item)"
        >
          <div class="flex gap-2 items-center">
            <ds-icon [id]="item.icon" class="size-4"></ds-icon>
            <span class="text-sm">{{ item.title }}</span>
          </div>
          <ds-icon
            id="arrow-down"
            class="size-3 transition-transform duration-300"
            [ngClass]="{ 'rotate-180': isOpen(item) }"
          >
          </ds-icon>
        </div>

        <ul *ngIf="isOpen(item)">
          <ng-container *ngFor="let subItem of item.items">
            <li
              class="relative after:absolute after:top-0 after:bottom-0 after:last:h-0 after:left-[-21px] after:w-px after:h-full after:bg-white before:absolute before:-left-[21px] before:border-white before:rounded-bl-md before:border-l before:border-b before:border-r-transparent before:border-t-transparent before:-top-[30px] before:content-[''] before:w-4 before:h-[40px] first:before:h-[20px] first:before:-top-[10px] font-light"
            >
              <ng-container *ngIf="hasChildren(subItem); else linkLevel2">
                <div
                  tabindex="0"
                  role="button"
                  class="flex w-full justify-between items-center pl-0.5"
                  (click)="toggle(subItem)"
                >
                  <div class="flex gap-2 items-center">
                    <ds-icon [id]="subItem.icon" class="size-4"></ds-icon>
                    <span class="text-sm">{{ subItem.title }}</span>
                  </div>
                  <ds-icon
                    id="arrow-down"
                    class="size-3 transition-transform duration-300"
                    [ngClass]="{ 'rotate-180': isOpen(subItem) }"
                  ></ds-icon>
                </div>
                <ul *ngIf="isOpen(subItem)" class="pl-4">
                  <li *ngFor="let subSub of subItem.items">
                    <a
                      class="w-full flex relative justify-between items-center gap-2 before:absolute before:content-[''] before:-left-4 before:top-1/2 before:-translate-y-1/2 before:size-1.5 before:rounded-full hover:before:bg-white before:transition-colors before:duration-300 before:ease-in-out"
                      [ngClass]="[
                        isActif === subSub.href
                          ? 'before:bg-white'
                          : 'before:bg-transparent'
                      ]"
                      [routerLink]="subSub.href"
                      (click)="handleLinkClick(subSub.href)"
                    >
                      <span class="text-sm">{{ subSub.title }} </span>
                      <span
                        *ngIf="subSub.isNew"
                        class="text-neutral-900 inline-flex py-0.5 px-1.5 rounded-full text-[0.625rem] leading-[12px] font-bold bg-amber-400 z-[10]"
                        >Nouveau</span
                      >
                      <span
                        *ngIf="subSub.isPending"
                        class="inline-flex items-center justify-center size-5 rounded-full bg-amber-400 text-white z-[10]"
                      >
                        <ds-icon id="clock-forward" class="size-3"></ds-icon>
                      </span>
                    </a>
                  </li>
                </ul>
              </ng-container>
              <ng-template #linkLevel2>
                <a
                  class="pl-0.5 pr-2 relative flex items-center gap-2 after:rounded-md after:z-[1] before:z-[3] after:absolute after:p-2 after:-inset-1 after:w-full after:content-[''] before:absolute before:content-[''] before:-left-1 before:top-1/2 before:-translate-y-1/2 before:w-[3px] before:h-3/4 before:rounded-r-full hover:before:bg-primary-500 hover:after:bg-green-700 before:transition-colors before:duration-300 before:ease-in-out after:transition-colors after:duration-300 after:ease-in-out"
                  [routerLink]="subItem.href"
                  (click)="handleLinkClick(subItem.href)"
                  [ngClass]="[
                    isActif === subItem.href
                      ? 'before:bg-primary-500 after:bg-[#323334]'
                      : 'before:bg-transparent after:bg-transparent'
                  ]"
                >
                  <ds-icon
                    [id]="subItem.icon"
                    class="size-4 relative z-[2]"
                  ></ds-icon>
                  <span class="text-sm pr-2 relative z-[2]">{{
                    subItem.title
                  }}</span>

                  <span
                    *ngIf="subItem.isNew"
                    class="text-neutral-900 inline-flex py-0.5 px-1.5 rounded-full text-[0.625rem] leading-[12px] font-bold bg-amber-400 z-[10]"
                    >Nouveau</span
                  >
                  <span
                    *ngIf="subItem.isPending"
                    class="inline-flex items-center justify-center size-5 rounded-full bg-amber-400 text-white z-[10]"
                  >
                    <ds-icon id="clock-forward" class="size-3"></ds-icon>
                  </span>
                </a>
              </ng-template>
            </li>
          </ng-container>
        </ul>
      </ng-container>
      <ng-template #linkLevel1>
        <a
          class="relative flex items-center gap-2"
          [routerLink]="item.href"
          (click)="handleLinkClick(item.href)"
        >
          <ds-icon [id]="item.icon" class="size-4"></ds-icon>
          <span class="text-sm">{{ item.title }}</span>
          <span
            *ngIf="item.isNew"
            class="absolute top-1/2 -translate-y-1/2 right-0 text-neutral-900 inline-flex py-0.5 px-1.5 rounded-full text-[0.625rem] leading-[12px] font-bold bg-amber-400"
            >Nouveau</span
          >
          <span
            *ngIf="item.isPending"
            class="absolute top-1/2 -translate-y-1/2 right-0 inline-flex items-center justify-center size-5 rounded-full bg-amber-400 text-white"
          >
            <ds-icon id="clock-forward" class="size-3"></ds-icon>
          </span>
        </a>
      </ng-template>
    </li>
  </ng-container>
</ul>
