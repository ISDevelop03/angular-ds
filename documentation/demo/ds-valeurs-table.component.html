<iframe
  data-src-dev="http://localhost:4201/valeurs-table"
  data-src-prod="https://example.com/valeurs-table"
  frameborder="0"
  style="width: 100%; height: 100%"
></iframe>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const isLocal =
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1";
    document.querySelectorAll("iframe[data-src-dev]").forEach((iframe) => {
      iframe.src = isLocal
        ? iframe.getAttribute("data-src-dev")
        : iframe.getAttribute("data-src-prod");
    });
  });
</script>
